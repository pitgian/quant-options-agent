name: Fetch Options Data

# Pipeline dati: catene opzioni + piano dei livelli del giorno + track record.
# Niente Kronos, niente torch: ~3 minuti per giro.

on:
  schedule:
    # GitHub THROTTLE i cron sotto carico (nella pratica */5 scatta ogni
    # 10-20 min): tre entry scaglionate danno una cadenza effettiva ~5 min.
    # La concurrency group serializza i ritardatari, nessun danno.
    - cron: '*/5 6-21 * * 1-5'
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 6-21 * * 1-5'
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 6-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-options
  cancel-in-progress: false

jobs:
  fetch-options:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Restore state from data branch
        run: |
          git fetch origin data || true
          git checkout origin/data -- data/options_data.json || true
          git checkout origin/data -- data/options_oi_lastgood.json || true
          git checkout origin/data -- data/day_plan.json || true
          git checkout origin/data -- data/level_stats.json || true

      - name: Fetch options data
        timeout-minutes: 10
        run: |
          python scripts/fetch_options_data.py --symbol ALL --output data/options_data.json
        env:
          TZ: America/New_York
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

      - name: Day plan (livelli del giorno + track record)
        timeout-minutes: 4
        run: |
          python scripts/day_plan.py || true
          # GUARDIA: `|| true` nasconde un crash dello script, e il piano resta
          # quello restaurato dal branch data (16/11: piano fermo alle 22:31 del
          # giorno prima mentre options_data era fresco, per un UnboundLocalError
          # nella generazione). Se il file non è stato riscritto ADESSO, il job
          # deve fallire: meglio un run rosso che un piano vecchio silenzioso.
          python - <<'EOF'
          import json, sys, datetime
          d = json.load(open('data/day_plan.json'))
          gen = d.get('generated_at', '')
          age = (datetime.datetime.now(datetime.timezone.utc)
                 - datetime.datetime.fromisoformat(gen)).total_seconds()
          print(f"day_plan generated_at={gen} → {age/60:.1f} min fa")
          if age > 600:
              sys.exit("day_plan NON rigenerato: scripts/day_plan.py è fallito prima della scrittura")
          EOF

      - name: Push to repository data branch
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/generated_data
          for f in options_data.json options_oi_lastgood.json day_plan.json level_stats.json; do
            cp data/$f /tmp/generated_data/ 2>/dev/null || true
          done
          rm -f data/options_data.json data/options_history.json data/day_plan.json data/level_stats.json
          git fetch origin data
          git checkout --force -B data origin/data --
          mkdir -p data
          cp /tmp/generated_data/* data/
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ ! -f vercel.json ]; then
            echo '{"git": {"deploymentEnabled": {"data": false}}, "ignoreCommand": "exit 0"}' > vercel.json
            git add vercel.json
          fi
          for f in options_data.json options_oi_lastgood.json day_plan.json level_stats.json; do
            git add data/$f 2>/dev/null || true
          done
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit on data branch."
            exit 0
          fi
          git commit --amend -m "chore: day plan + dati opzioni [skip ci]"
          git push --force-with-lease origin data
